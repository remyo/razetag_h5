name: Publish website to RazeDev
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-razetag
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out private website source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Reject outdated source runs
        working-directory: source
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          helper=$(mktemp "$RUNNER_TEMP/raze-source-askpass.XXXXXX")
          trap 'rm -f "$helper"' EXIT
          cat > "$helper" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' x-access-token ;;
            *) printf '%s' "$GH_SOURCE_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$helper"
          GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'Source main advanced. Dispatch the latest main.' >&2; exit 1; }
      - name: Check out public destination
        uses: actions/checkout@v7
        with:
          repository: remyo/razedev
          ref: main
          path: razedev
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate and publish only this app
        env:
          RAZEDEV_PUBLISH_TOKEN: ${{ secrets.RAZEDEV_PUBLISH_TOKEN }}
        run: node razedev/scripts/publish-product.mjs --app razetag --source "$GITHUB_WORKSPACE/source" --checkout "$GITHUB_WORKSPACE/razedev" --max-attempts 3
